<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories</title>
    <link rel="stylesheet" href="/static/css/u4u.css">
    <script src="/static/js/categories.js" defer></script>
</head>
<body>
    <h1>Manage Categories</h1>

    <!-- Form to add a new category -->
    <form id="add-category-form" action="/categories" method="post">
        <input type="text" name="name" placeholder="Category Name" required>
        <input type="color" name="color" value="#ff0000" required>
        <button type="submit">Add Category</button>
    </form>

    <!-- Table to display existing categories -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Color</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.id }}</td>
                <td>{{ category.name }}</td>
                <td>
                    <span style="display:inline-block; width:20px; height:20px; background-color:{{ category.color }};"></span>
                    {{ category.color }}
                </td>
                <td>
                    <button onclick="deleteCategory({{ category.id }})">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
