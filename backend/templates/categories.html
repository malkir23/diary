<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories</title>
    <link rel="stylesheet" href="/static/css/u4u.css">
    <script src="/static/js/categories.js" defer></script>
</head>
<body>
    <h1>Manage Categories</h1>

		<div class="navigation">
			<button onclick="location.href='/api/u4u/table'" class="nav-button">До списку</button>
			<button onclick="location.href='/api/u4u/tasks/list'" class="nav-button">Категорії</button>
		</div>
    <!-- Form to add a new category -->
		<h2>Create a New Category</h2>
		<form id="create-category-form" onsubmit="createCategory(event)">
				<label for="category-name">Name:</label>
				<input type="text" id="category-name" name="name" required>

				<label for="category-color">Color:</label>
				<input type="color" id="category-color" name="color" required>

				<button type="submit">Create</button>
		</form>
		<hr>

    <!-- Table to display existing categories -->
		<table id="categories-table">
			<thead>
					<tr>
							<th>Name</th>
							<th>Color</th>
							<th>Actions</th>
					</tr>
			</thead>
			<tbody>
					{% for category in categories %}
					<tr id="category-row-{{ category.id }}">
							<td class="category-name">{{ category.name }}</td>
							<td class="category-color"><input type="color" value="{{ category.color }}" disabled></td>
							<td>
									<button class="edit-button" onclick="enableEdit({{ category.id }})">Edit</button>
									<button class="save-button" onclick="saveEdit({{ category.id }})" style="display: none;">Save</button>
									<button class="cancel-button" onclick="cancelEdit({{ category.id }})" style="display: none;">Cancel</button>
									<button class="delete-button" onclick="deleteCategory({{ category.id }})">Delete</button>
							</td>
					</tr>
					{% endfor %}
			</tbody>
	</table>

</body>
</html>
