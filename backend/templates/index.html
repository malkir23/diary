<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

</head>
<body>
    <h1>Task Board</h1>
    <div class="board">
        <div class="column" id="todo">
            <h2>To Do</h2>
            <div class="tasks" ondrop="drop(event)" ondragover="allowDrop(event)">
                {% for task in tasks.todo %}
                <div class="task" draggable="true" ondragstart="drag(event)" id="{{ task }}">{{ task }}</div>
                {% endfor %}
            </div>
        </div>
        <div class="column" id="in_progress">
            <h2>In Progress</h2>
            <div class="tasks" ondrop="drop(event)" ondragover="allowDrop(event)">
                {% for task in tasks.in_progress %}
                <div class="task" draggable="true" ondragstart="drag(event)" id="{{ task }}">{{ task }}</div>
                {% endfor %}
            </div>
        </div>
        <div class="column" id="done">
            <h2>Done</h2>
            <div class="tasks" ondrop="drop(event)" ondragover="allowDrop(event)">
                {% for task in tasks.done %}
                <div class="task" draggable="true" ondragstart="drag(event)" id="{{ task }}">{{ task }}</div>
                {% endfor %}
            </div>
        </div>
    </div>

</body>
</html>
